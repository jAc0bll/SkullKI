  <rect x="262" y="196" width="500" height="660" rx="96" fill="url(#glass)" stroke="url(#rim)" stroke-width="6"/>
  <path d="M332 470 L432 552 L512 404 L592 552 L692 470 L656 690 L368 690 Z" fill="url(#crown)" stroke="#e8fbff" stroke-opacity=".7" stroke-width="10" stroke-linejoin="round"/>
