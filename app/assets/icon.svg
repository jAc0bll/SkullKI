<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#1b2a6b"/><stop offset=".45" stop-color="#0b0f24"/><stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <radialGradient id="orb1" cx="78%" cy="82%" r="45%"><stop offset="0" stop-color="#00b3a4" stop-opacity=".55"/><stop offset="1" stop-color="#00b3a4" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2" cx="85%" cy="15%" r="40%"><stop offset="0" stop-color="#8e3bff" stop-opacity=".5"/><stop offset="1" stop-color="#8e3bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
