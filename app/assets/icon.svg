    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be8ff"/><stop offset=".5" stop-color="#5ac8fa"/><stop offset="1" stop-color="#0a84ff"/>
